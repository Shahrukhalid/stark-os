# When the version on main changes, creates the tag vX.Y.Z (once) and starts the Desktop workflow for it, which builds
# the installers and publishes the release. Tags made with the workflow token start no push-triggered runs, so the
# Desktop workflow is started here directly.
name: Tag release
on:
  push:
    branches: [main]
    paths: [services/api/stark/__init__.py]
  workflow_dispatch:
permissions:
  contents: read
concurrency: tag-release
jobs:
  tag:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re;print(re.search(r"__version__ = \"([0-9]+\.[0-9]+\.[0-9]+)\"", open("services/api/stark/__init__.py").read()).group(1))')"
          tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do"; exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          gh workflow run desktop.yml --ref "$tag"
          echo "Tagged $tag and started the Desktop release build"
