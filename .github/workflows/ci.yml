# GitHub Actions: backend tests (incl. PostgreSQL + real Chromium), dashboard type-check/unit/E2E, secret scan.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: stark, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: stark_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/api/requirements.lock && pip install --no-deps -e "services/api" && pip install "pytest>=8" "pytest-asyncio>=0.23" "playwright>=1.45" "psycopg[binary]>=3.1" && python -m playwright install --with-deps chromium
      - name: Video tools for the video studio tests (FFmpeg, a test voice, speech-to-text and its smallest model)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng >/dev/null
          pip install "pywhispercpp>=1.2"
          curl -sSfL -o "$RUNNER_TEMP/ggml-tiny.bin" https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
      - run: cd services/api && python -m pytest -q
        env:
          TEST_DATABASE_URL: "postgresql+psycopg://stark:ci-only-password@127.0.0.1:5432/stark_test"
          STARK_TEST_WHISPER_MODEL: ${{ runner.temp }}/ggml-tiny.bin
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r services/api/requirements.lock && pip install --no-deps -e "services/api" && cd apps/web && npm ci && npx playwright install --with-deps chromium
      - run: cd apps/web && npx tsc --noEmit && npm test && npm run build
      - run: cd apps/web && npx playwright test
        env: { STARK_PYTHON: python }
  windows-setup:
    # scripts/setup.ps1 and scripts/dev.ps1 (issue #8): install from scratch, start both servers, check health
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: scripts\setup.ps1
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\setup.ps1
      - name: scripts\dev.ps1 starts the API and dashboard
        shell: pwsh
        env: { STARK_DEV_EXIT_WHEN_READY: "1", STARK_WEB_PORT: "3737", STARK_PORT: "8737" }
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\dev.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: API tests on Windows (social and runtime)
        shell: pwsh
        run: |
          cd services/api
          .venv\Scripts\python.exe -m pytest -q tests/test_social.py tests/test_runtime.py
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # organisation-owned repos also need: GITLEAKS_LICENSE: "${{ secrets.GITLEAKS_LICENSE }}"
