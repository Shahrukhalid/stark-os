# STARK AI - local deployment.
# Ports are bound to 127.0.0.1 only.
#
# First-time startup (no .env required):
#   docker compose up -d --build
#
# The API automatically generates a persistent authentication token
# when STARK_API_TOKEN is not configured.
#
# Retrieve the automatically generated token:
#   docker compose exec api cat /app/data/api-token
#
# Optional manual setup:
#   python scripts/setup.py
#
# On Linux, set UID to allow writing to the bind-mounted sandbox:
#   UID=$(id -u) docker compose up -d --build
#
# Optional PostgreSQL:
#   docker compose --profile postgres up -d --build
# Set POSTGRES_PASSWORD and DATABASE_URL in .env first.

services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args: { STARK_UID: "${UID:-1000}" }
    env_file:
      - path: .env
        required: false
    environment:
      STARK_WEB_ORIGIN: http://localhost:3000
      STARK_WORKSPACE_ROOTS: /app/sandbox
    volumes:
      - stark-data:/app/data
      - ./sandbox:/app/sandbox
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_STARK_API_URL: "http://localhost:8000" }
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stark
      POSTGRES_DB: stark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # required: set in .env (postgres refuses to start without it)
    volumes: [stark-pg:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]

volumes:
  stark-data:
  stark-pg:
