# STARK OS - local deployment. Ports are bound to 127.0.0.1 only.
#   python3 scripts/setup.py      (creates .env with a random STARK_API_TOKEN; then add OPENROUTER_API_KEY)
#   UID=$(id -u) docker compose up --build   (UID lets the container write to ./sandbox on Linux)
# Optional PostgreSQL:  docker compose --profile postgres up --build
#   and set DATABASE_URL=postgresql+psycopg://stark:${POSTGRES_PASSWORD}@postgres:5432/stark in .env
services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
      args: { STARK_UID: "${UID:-1000}" }
    env_file: .env
    environment:
      STARK_API_TOKEN: ${STARK_API_TOKEN:?run python3 scripts/setup.py first to create .env}
      STARK_WEB_ORIGIN: http://localhost:3000
      STARK_WORKSPACE_ROOTS: /app/sandbox
    volumes:
      - stark-data:/app/data
      - ./sandbox:/app/sandbox
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { NEXT_PUBLIC_STARK_API_URL: "http://localhost:8000" }
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stark
      POSTGRES_DB: stark
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}  # required: set in .env (postgres refuses to start without it)
    volumes: [stark-pg:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]

volumes:
  stark-data:
  stark-pg:
