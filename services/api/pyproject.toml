[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stark-os-api"
version = "0.5.0"
description = "STARK OS - Project Genesis: governed multi-agent social media team on free models (API)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "sqlalchemy>=2.0.30",
  "httpx>=0.27",
  "psutil>=5.9",
  "pypdf>=4.0",
  "regex>=2024.5",  # grapheme clusters (\X) for Bluesky's 300-character limit
  "tzdata>=2024.1; sys_platform == 'win32'",  # time zones for Autopilot posting times (built into macOS/Linux)
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
stark-api = "stark.main:run"

[tool.setuptools.packages.find]
include = ["stark*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: needs Playwright + Chromium", "postgres: needs a PostgreSQL server (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# real-bug rules only (syntax errors, undefined/unused names, bugbear); CI runs `ruff check`
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
  "B008",  # FastAPI's Depends()/Query() in argument defaults is the intended pattern
  "E731",  # lambda assignment (style)
  "B904",  # HTTPException raised inside except: FastAPI idiom, the traceback never reaches the client
]

[tool.ruff.lint.per-file-ignores]
"stark/autopilot.py" = ["F401"]
"tests/test_security_regressions.py" = ["B017"]  # pytest.raises(Exception) on a pydantic model; narrow it next time  # one unused import (core.db.Task); harmless, drop it next time the file is edited
